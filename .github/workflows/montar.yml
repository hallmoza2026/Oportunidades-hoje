name: Montar projeto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          test -f vagas-hoje-corrigido.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name vagas-hoje-corrigido.zip -exec rm -rf {} +
          unzip -q vagas-hoje-corrigido.zip -x '.github/*'
          rm vagas-hoje-corrigido.zip
      - name: Guardar
        run: |
          git config user.name "montar-bot"
          git config user.email "montar-bot@users.noreply.github.com"
          git add -A
          git commit -m "Montar projeto a partir do zip"
          git push
